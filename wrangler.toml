# Neus CORS Proxy — Cloudflare Worker
# Stateless RSS proxy. No KV, no Durable Objects, no state.
# Deploy: wrangler deploy

name = "neus-proxy"
main = "_worker.js"
compatibility_date = "2024-09-23"

[observability]
enabled = true

# Worker is CPU-bound, not I/O-bound. No special limits needed.
# Free plan: 100,000 requests/day, 10ms CPU time/request

# Routes are set on Cloudflare dashboard:
#   https://neus-proxy.your-subdomain.workers.dev/*
# or via custom domain binding in Pages project settings.

# Environment variables (set via Cloudflare dashboard, NOT here)
# No secrets needed — proxy is fully stateless and public.
